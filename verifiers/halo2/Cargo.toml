[package]
name = "pallet-halo2-verifier"
version = "0.1.0"
description = "A halo2 verifier pallet implementation based on pallet-verifiers abstraction."
authors.workspace = true
edition.workspace = true
repository.workspace = true
homepage.workspace = true
license = "Apache-2.0"

[lints]
workspace = true

[dependencies]
codec = { workspace = true }
scale-info = { workspace = true }
sp-core = { workspace = true }
sp-std = { workspace = true }
hp-verifiers = { workspace = true }
frame-support = { workspace = true }
frame-system = { workspace = true }
pallet-verifiers = { workspace = true }
frame-benchmarking = { workspace = true, optional = true }
log = { workspace = true }
hex-literal = { workspace = true, optional = true }
native = { workspace = true }
sp-io = { workspace = true }
halo2_proofs = { git = "https://github.com/privacy-scaling-explorations/halo2.git", tag = "v0.3.0" }
vm-circuit = { path = "../../../zkmove-vm/vm-circuit"}
types = { path = "../../../zkmove-vm/common/types" }
move-package = { git = "https://github.com/zkmove/aptos-core", rev = "59647fda5" }
anyhow = "1.0.38"
rand = { version = "0.8" }
educe = { version = "0.6.0", default-features = false, features = [
	"Clone",
	"Debug",
	"PartialEq",
] }

[dev-dependencies]
hex-literal = { workspace = true }
serial_test = "3.1.1"
codec = { workspace = true, features = ["std"] }
sp-io = { workspace = true, features = ["std"] }
scale-info = { workspace = true }
sp-runtime = { workspace = true }
pallet-balances = { workspace = true, features = ["std", "runtime-benchmarks"] }
rand = { version = "0.8" }

[features]
std = [
	"sp-core/std",
	"sp-std/std",
	"sp-io/std",
	"hp-verifiers/std",
	"frame-support/std",
	"frame-system/std",
	"pallet-verifiers/std",
	"native/std",
	"pallet-balances/std",
	"frame-benchmarking?/std",
	"log/std",
	"codec/std",
	"scale-info/std",
	"sp-runtime/std",
#	"halo2_proofs/std"
]
default = ["std"]
runtime-benchmarks = [
	"dep:hex-literal",
	"dep:frame-benchmarking",
	"pallet-verifiers/runtime-benchmarks",
	"frame-support/runtime-benchmarks",
	"frame-system/runtime-benchmarks",
	"frame-benchmarking/runtime-benchmarks",
	"pallet-balances/runtime-benchmarks",
	"sp-runtime/runtime-benchmarks"
]
